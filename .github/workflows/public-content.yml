name: Public content
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check-public-content.py --all
      - run: python -m pip install pytest
      - run: python -m pytest tests/unit/test_public_content.py -q
      - name: Check commit content
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            python scripts/check-public-content.py --commits "$BASE_SHA..$HEAD_SHA"
          else
            python scripts/check-public-content.py --commits "$HEAD_SHA^!"
          fi
